<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AG Bot</title>
<style>
:root{--bg:#1e1f26;--bar:#2b2d38;--in:#3a3d4d;--ac:#4f8cff;--me:#2f5fc4;--bot:#2e3b34}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,sans-serif}
header{background:var(--bar);padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
#sure{font-size:13px;color:#ffd479}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
button.g{background:var(--in)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:9px 13px;border-radius:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me)}
.bot{align-self:flex-start;background:var(--bot)}
.inf{align-self:center;color:#aaa;font-size:13px;font-style:italic}
form{display:flex;gap:8px;padding:10px;background:var(--bar)}
input{flex:1;background:var(--in);color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;outline:none}
#giris{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5}
#kutu{background:var(--bar);padding:28px;border-radius:14px;width:min(360px,90vw);text-align:center}
#kutu h2{margin:0 0 6px}
#kutu p{color:#aaa;font-size:14px;margin:0 0 16px}
#kutu input{width:100%;margin-bottom:10px;text-align:center}
#kutu button{width:100%}
#hata{color:#ff7b7b;font-size:14px;min-height:20px;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="giris">
  <div id="kutu">
    <h2>🤖 AG Bot</h2>
    <p>Devam etmek için ID'ni gir</p>
    <input id="idKutu" placeholder="ID" autocomplete="off" inputmode="numeric">
    <button id="bGiris">Giriş Yap</button>
    <div id="hata"></div>
  </div>
</div>

<header>
  <h1>🤖 AG Bot</h1>
  <span id="sure"></span>
  <button class="g" id="bCikis">Çıkış</button>
</header>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="Bir şey yaz..." autocomplete="off"><button>Gönder</button></form>

  ["yarın hava nasıl", "Yarın için canlı tahmin göremiyorum; yerel hava durumu uygulamanı kontrol et."],
  ["ders çalışıyorum", "Kolay gelsin! Kısa molalar vermek ve konuyu parçalara bölmek işe yarayabilir."],
  ["sınavım var", "Başarılar! Konuları küçük parçalara ayırıp tekrar etmek yardımcı olabilir."],
  ["ödevime yardım et", "Tabii, ödevin hangi konu hakkında? Soruyu buraya yaz."],
  ["matematik zor", "Önce soruyu küçük adımlara bölelim. Hangi konuda takıldın?"],
  ["uykum var", "Biraz dinlenmek iyi gelebilir. Mümkünse kısa bir mola ver."],
  ["acıkmışım", "Bir şeyler atıştırma vakti olabilir! Ne yemeyi düşünüyorsun?"],
  ["susadım", "Bir bardak su içmek iyi fikir olabilir."],
  ["kahve sever misin", "Kahve içemem ama kokusunun insanları uyandırdığını biliyorum!"],
  ["çay sever misin", "Çay içemem ama çay sohbetlerinin güzel olduğunu duydum."],
  ["tatil istiyorum", "Umarım yakında güzel bir tatil yaparsın! Aklında bir yer var mı?"],
  ["seyahat etmeyi sever misin", "Seyahat edemem ama gezilecek yerler hakkında fikir verebilirim."],
  ["istanbul güzel mi", "İstanbul tarihi, manzaraları ve hareketli yaşamıyla çok renkli bir şehir."],
  ["hayalim var", "Harika! İstersen hayalini ve ona yaklaşmak için düşündüğün adımları anlat."],
  ["hedef belirlemek istiyorum", "Hedefini küçük ve ölçülebilir adımlara ayırmak iyi bir başlangıç olabilir."],
  ["motivasyon ver", "Küçük bir adım bile ilerlemedir. Bugün yapabileceğin en kolay şeyle başla!"],
  ["başaramayacağım", "Şu an zor görünmesi başaramayacağın anlamına gelmez. Bir adım deneyelim."],
  ["çok yoruldum", "Biraz dinlenmek ve su içmek iyi gelebilir. Kendine zaman tanı."],
  ["bugün güzel geçti", "Buna sevindim! Gününün en güzel kısmı neydi?"],
  ["bugün kötü geçti", "Üzgünüm. İstersen anlat, seni dinliyorum."],
  ["ne düşünüyorsun", "Kendi düşüncelerim yok ama söylediklerin üzerine birlikte konuşabiliriz."],
  ["fikrin ne", "Biraz daha ayrıntı verirsen seçenekleri birlikte değerlendirebiliriz."],
  ["sohbet edelim", "Memnuniyetle! Son zamanlarda ilgini çeken bir şey var mı?"],
  ["konu aç", "Son zamanlarda öğrenmek istediğin yeni bir şey var mı?"],
  ["sırrımı saklar mısın", "Bu sohbetin gizliliğini garanti edemem; hassas bilgileri paylaşmaman daha güvenli."],
  ["şifremi paylaşayım mı", "Hayır, şifreni kimseyle paylaşma; buraya da yazma."],
  ["internete bağlanıyor musun", "Hayır, bu sayfadaki bot internette arama yapmıyor."],
  ["cevabını nereden biliyorsun", "Cevaplarım bu sayfanın içine önceden eklenmiş basit metinlerden geliyor."],
  ["yanlış cevap verdin", "Uyardığın için teşekkürler! Bu basit bot bazen soruyu yanlış anlayabilir."],
  ["beni anlamadın", "Haklı olabilirsin. Sorunu başka kelimelerle tekrar yazar mısın?"],
  ["türkçe biliyor musun", "Evet, Türkçe mesajlara cevap vermeye çalışıyorum."],
  ["ingilizce biliyor musun", "Basit İngilizce ifadeleri tanıyabilirim ama bu botun cevapları sınırlı."],
  ["emoji gönder", "🙂✨🤖"],
  ["bir sayı söyle", "7! Kulağa şanslı bir sayı gibi geliyor."],
  ["bir renk söyle", "Turkuaz! Maviyle yeşilin güzel bir karışımı."],
  ["kaç soru biliyorsun", "Bu sayfada 100 farklı cevap ve her biri için 10 soru kalıbı var."],
  ["cevapların hazır mı", "Evet, bu sayfadaki cevaplar önceden yazılmıştır; internetten yeni bilgi almıyorum."],
  ["beni duyuyor musun", "Sesini duyamam ama buraya yazdığın mesajları okuyabilirim."],
  ["fotoğraf görebiliyor musun", "Hayır, bu sohbet yalnızca yazdığın mesajları işler."],
  ["nasıl çalışıyorsun", "Mesajındaki kelimeleri sayfadaki soru kalıplarıyla karşılaştırıyorum."],
  ["sana nasıl soru sorarım", "Mesaj kutusuna sorununu yazıp Gönder düğmesine basman yeterli."],
  ["botu kim yaptı", "Bu sayfadaki AG Bot, basit JavaScript kurallarıyla çalışan bir sohbet örneği."],
  ["seni kim yaptı", "Bu botun sayfasını hazırlayan kişi yaptı; ben kendi başıma gelişmiyorum."],
  ["günün nasıl geçti", "Benim gerçek bir günüm yok ama seninkini dinlemek isterim!"],
  ["yarın ne yapacaksın", "Plan yapamam ama senin yarın için plan oluşturmana yardım edebilirim."],
  ["hoşlandığın biri var mı", "Duygularım yok ama hoşlanma hakkında konuşabiliriz."],
  ["aşk nedir", "Aşk, insanlar için yakınlık, bağlılık ve önemseme gibi duyguları anlatan bir kavramdır."],
  ["hayvanları sever misin", "Duygularım yok ama hayvanların insanlara arkadaşlık etmesi çok güzel."],
  ["kedileri sever misin", "Kedi videoları internette çok popüler! Sen kedi sever misin?"],
  ["köpekleri sever misin", "Köpekler sadık dostlar olarak bilinir. Senin bir köpeğin var mı?"],
  ["en sevdiğin mevsim ne", "Gerçek bir tercihim yok ama ilkbaharın havası pek çok kişiye iyi geliyor."],
  ["napıyon kanka", "Buradayım kanka, seninle sohbet ediyorum!"]
];

const temiz = s => s.toLocaleLowerCase("tr").replace(/[?!.,]+/g, " ").replace(/\s+/g, " ").trim();
const soruKunye = new Map();
const kaliplar = [
  s => s,
  s => "ya " + s,
  s => "peki " + s,
  s => "acaba " + s,
  s => "bir şey soracağım " + s,
  s => "kanka " + s,
  s => "dostum " + s,
  s => s + " acaba",
  s => s + " söyler misin",
  s => s + " anlatır mısın"
];
for (const [soru, cevap] of niyetler) {
  for (const kalip of kaliplar) soruKunye.set(temiz(kalip(soru)), soru);
}
const bilgi = Object.fromEntries(niyetler);

/* ===== KODUN GERİSİ ===== */
const $ = id => document.getElementById(id);
const SURE_MS = SURE_DK * 60 * 1000;
let aktifId = null, sinirsiz = false, sayac = null, bitis = 0;

const oku = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const yazDepo = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const kullanilan = id => parseInt(oku("ag_kullanim_" + id) || "0", 10);

function yaz(t, c) {
  const d = document.createElement("div");
  d.className = "m " + c; d.textContent = t;
  $("chat").appendChild(d); $("chat").scrollTop = 1e9;
}

function lev(a, b) {
  const m = [...Array(a.length + 1)].map((_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] == b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}
const benzerlik = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function bul(s) {
  if (soruKunye.has(s)) return soruKunye.get(s);
  if (s.length < 5) return null;
  let en = null, p = 0;
  for (const k of soruKunye.keys()) {
    const b = benzerlik(s, k);
    if (b > p) { p = b; en = soruKunye.get(k); }
  }
  return p >= 0.72 ? en : null;
}

function giris() {
  const id = $("idKutu").value.trim();
  if (!id) { $("hata").textContent = "ID gir."; return; }
  if (id !== SINIRSIZ_ID && kullanilan(id) >= SURE_MS) {
    $("hata").textContent = "Bu ID'nin süresi dolmuş."; return;
  }
  aktifId = id; sinirsiz = (id === SINIRSIZ_ID);
  $("hata").textContent = ""; $("idKutu").value = "";
  $("giris").classList.add("hidden");
  $("chat").innerHTML = "";
  yaz(sinirsiz ? "Hoş geldin! Sınırsız kullanımdasın." : "Hoş geldin! " + SURE_DK + " dakikalık kullanım hakkın var.", "inf");
  yaz("Merhaba! Bir şey sor.", "bot");
  $("q").disabled = false; $("q").focus();
  if (sinirsiz) { $("sure").textContent = "♾️ Sınırsız"; }
  else {
    bitis = Date.now() + (SURE_MS - kullanilan(id));
    sayac = setInterval(tik, 1000); tik();
  }
}

function tik() {
  const kalan = bitis - Date.now();
  if (kalan <= 0) { sureBitti(); return; }
  yazDepo("ag_kullanim_" + aktifId, String(SURE_MS - kalan));
  const dk = Math.floor(kalan / 60000), sn = Math.floor(kalan % 60000 / 1000);
  $("sure").textContent = "⏱ " + dk + ":" + String(sn).padStart(2, "0");
}

function durdur() { if (sayac) clearInterval(sayac); sayac = null; }

function sureBitti() {
  yazDepo("ag_kullanim_" + aktifId, String(SURE_MS));
  durdur(); $("q").disabled = true; $("sure").textContent = "⏱ 0:00";
  yaz("Süren doldu. Başka bir ID ile giriş yapabilirsin.", "inf");
  setTimeout(cikis, 2500);
}

function cikis() {
  if (!sinirsiz && aktifId && sayac) tik();
  durdur(); aktifId = null; $("sure").textContent = "";
  $("giris").classList.remove("hidden"); $("idKutu").focus();
}

$("bGiris").onclick = giris;
$("idKutu").addEventListener("keydown", e => { if (e.key === "Enter") giris(); });
$("bCikis").onclick = cikis;

$("f").onsubmit = e => {
  e.preventDefault();
  if (!aktifId) return;
  const ham = $("q").value.trim(); if (!ham) return;
  $("q").value = ""; yaz(ham, "me");
  const k = bul(temiz(ham));
  yaz(k ? bilgi[k] : "Bunu bilmiyorum.", "bot");
};

$("idKutu").focus();
</script>
</body>
</html>
