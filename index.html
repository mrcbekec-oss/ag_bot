.hidden{display:none!important}

const temiz = s => s.toLocaleLowerCase("tr").replace(/[?!.,]+/g, " ").replace(/\s+/g, " ").trim();
const soruKunye = new Map();
const kaliplar = [
  s => s,
  s => "ya " + s,
  s => "peki " + s,
  s => "acaba " + s,
  s => "bir şey soracağım " + s,
  s => "kanka " + s,
  s => "dostum " + s,
  s => s + " acaba",
  s => s + " söyler misin",
  s => s + " anlatır mısın"
];
for (const [soru, cevap] of niyetler) {
  for (const kalip of kaliplar) soruKunye.set(temiz(kalip(soru)), soru);
}
const bilgi = Object.fromEntries(niyetler);

/* ===== KODUN GERİSİ ===== */
const $ = id => document.getElementById(id);
const SURE_MS = SURE_DK * 60 * 1000;
let aktifId = null, sinirsiz = false, sayac = null, bitis = 0, cevapBekliyor = false;

const oku = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const yazDepo = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const kullanilan = id => parseInt(oku("ag_kullanim_" + id) || "0", 10);

function yaz(t, c) {
  const d = document.createElement("div");
  d.className = "m " + c; d.textContent = t;
  $("chat").appendChild(d); $("chat").scrollTop = 1e9;
}

function lev(a, b) {
  const m = [...Array(a.length + 1)].map((_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] == b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}
const benzerlik = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function bul(s) {
  if (soruKunye.has(s)) return soruKunye.get(s);
  if (s.length < 5) return null;
  let en = null, p = 0;
  for (const k of soruKunye.keys()) {
    const b = benzerlik(s, k);
    if (b > p) { p = b; en = soruKunye.get(k); }
  }
  return p >= 0.72 ? en : null;
}

const karsilikliNiyetler = new Set([
  "napıyon", "sen napıyon", "sen napıyorsun", "sen ne yapıyorsun",
  "ne yapıyosun", "ne yapıyorsun", "napıyon kanka"
]);
const aktiviteNiyetleri = new Set([
  "ders çalışıyorum", "oyun oynuyorum", "film izliyorum", "müzik dinliyorum",
  "kitap okuyorum", "yemek yiyorum", "spor yapıyorum", "dışarı çıkıyorum",
  "evdeyim", "okuldayım", "işteyim", "mola veriyorum",
  "hiçbir şey yapmıyorum", "sana yazıyorum"
]);

function aktiviteyeCevap(metin) {
  const s = temiz(metin);
  if (s.includes("ders") || s.includes("ödev") || s.includes("sınav")) return "Kolay gelsin! Hangi ders üzerinde çalışıyorsun?";
  if (s.includes("oyun")) return "İyi eğlenceler! Hangi oyunu oynuyorsun?";
  if (s.includes("film") || s.includes("dizi")) return "Keyifli seyirler! Ne izliyorsun?";
  if (s.includes("müzik") || s.includes("şarkı")) return "Güzel! Hangi şarkıyı dinliyorsun?";
  if (s.includes("kitap") || s.includes("okuyorum")) return "Keyifli okumalar! Ne okuyorsun?";
  if (s.includes("yemek") || s.includes("yiyorum")) return "Afiyet olsun! Ne yiyorsun?";
  if (s.includes("spor") || s.includes("koşuyorum")) return "Harika! Hangi sporu yapıyorsun?";
  if (s.includes("uyuyorum") || s.includes("dinleniyorum")) return "İyi dinlenmeler! Sonra yine sohbet ederiz.";
  if (s.includes("dışarı") || s.includes("geziyorum")) return "İyi gezmeler! Nereye gidiyorsun?";
  if (s.includes("evdeyim") || s.includes("oturuyorum")) return "Evde keyif yapıyorsun demek! Şu an ne yapıyorsun?";
  if (s.includes("okuldayım")) return "Kolay gelsin! Bugün hangi derslerin var?";
  if (s.includes("işteyim")) return "Kolay gelsin! İşlerin yoğun mu bugün?";
  if (s.includes("mola veriyorum")) return "İyi fikir! Molanda biraz dinlenip su içebilirsin.";
  if (s.includes("hiçbir şey") || s.includes("hiç bi şey")) return "Bazen dinlenmek de güzeldir! İstersen beraber sohbet edelim.";
  if (s.includes("sana yaz") || s.includes("sohbet ed")) return "Ben de seninle sohbet ediyorum! Konu olarak ne seçelim?";
  return "Anladım! Peki yaptığın şey hoşuna gidiyor mu?";
}

function cevapla(metin) {
  const soru = temiz(metin), k = bul(soru);
  if (cevapBekliyor && (!k || aktiviteNiyetleri.has(k))) {
    cevapBekliyor = false;
    return aktiviteyeCevap(metin);
  }
  cevapBekliyor = karsilikliNiyetler.has(k);
  if (k === "kaç soru biliyorsun") return "Şu anda " + niyetler.length + " farklı konuya hazır cevabım var. Her konu için farklı soru kalıpları da kullanabilirsin!";
  if (k) return bilgi[k];
  const bilinmeyenCevaplar = [
    "Bunu tam anlayamadım. Bugün neler yapıyorsun?",
    "Güzelmiş! Biraz daha anlatır mısın?",
    "Peki, sonra ne oldu?",
    "Anladım 🙂 Bu konuda en çok neyi seviyorsun?",
    "İlginç! Biraz daha sohbet edelim mi?",
    "Hmm, bunu biraz açar mısın?",
    "Peki sen ne düşünüyorsun?",
    "Anladım. Başka nelerden hoşlanırsın?",
    "Bunu yeni duydum! Bana biraz daha anlat.",
    "Peki, bugün seni en çok ne mutlu etti?"
  ];
  return bilinmeyenCevaplar[Math.floor(Math.random() * bilinmeyenCevaplar.length)];
}

function giris() {
  const id = $("idKutu").value.trim();
  if (!id) { $("hata").textContent = "ID gir."; return; }
  if (id !== SINIRSIZ_ID && kullanilan(id) >= SURE_MS) {
    $("hata").textContent = "Bu ID'nin süresi dolmuş."; return;
  }
  aktifId = id; sinirsiz = (id === SINIRSIZ_ID);
  cevapBekliyor = false;
  $("hata").textContent = ""; $("idKutu").value = "";
  $("giris").classList.add("hidden");
  $("chat").innerHTML = "";
  yaz(sinirsiz ? "Hoş geldin! Sınırsız kullanımdasın." : "Hoş geldin! " + SURE_DK + " dakikalık kullanım hakkın var.", "inf");
  yaz("Merhaba! Bir şey sor.", "bot");
  $("q").disabled = false; $("q").focus();
  if (sinirsiz) { $("sure").textContent = "♾️ Sınırsız"; }
  else {
    bitis = Date.now() + (SURE_MS - kullanilan(id));
    sayac = setInterval(tik, 1000); tik();
  }
}

function tik() {
  const kalan = bitis - Date.now();
  if (kalan <= 0) { sureBitti(); return; }
  yazDepo("ag_kullanim_" + aktifId, String(SURE_MS - kalan));
  const dk = Math.floor(kalan / 60000), sn = Math.floor(kalan % 60000 / 1000);
  $("sure").textContent = "⏱ " + dk + ":" + String(sn).padStart(2, "0");
}

function durdur() { if (sayac) clearInterval(sayac); sayac = null; }

function sureBitti() {
  yazDepo("ag_kullanim_" + aktifId, String(SURE_MS));
  durdur(); $("q").disabled = true; $("sure").textContent = "⏱ 0:00";
  yaz("Süren doldu. Başka bir ID ile giriş yapabilirsin.", "inf");
  setTimeout(cikis, 2500);
}

function cikis() {
  if (!sinirsiz && aktifId && sayac) tik();
  durdur(); aktifId = null; cevapBekliyor = false; $("sure").textContent = "";
  $("giris").classList.remove("hidden"); $("idKutu").focus();
}

$("bGiris").onclick = giris;
$("idKutu").addEventListener("keydown", e => { if (e.key === "Enter") giris(); });
$("bCikis").onclick = cikis;

$("f").onsubmit = e => {
  e.preventDefault();
  if (!aktifId) return;
  const ham = $("q").value.trim(); if (!ham) return;
  $("q").value = ""; yaz(ham, "me");
  yaz(cevapla(ham), "bot");
};

$("idKutu").focus();
</script>
